name: Validate PWA
on:
  push:
    branches: ["main", "production/tamil-sinhala-auth-assets", "production/auth-recovery-release"]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
